[project]
name = "teabot-music"
version = "0.1.0"
description = "A teabot plugin that plays YouTube, SoundCloud and Spotify tracks in a voice channel"
readme = "README.md"
license = "MIT"
authors = [{ name = "Justas Leščinskas" }]
requires-python = ">=3.12"
# Voice needs teabot's voice extra (D53). PyAV's wheels carry FFmpeg and libopus, and yt-dlp solves YouTube's
# challenges with Deno and yt-dlp-ejs, which are on PyPI too, so nothing outside PyPI is needed (S8). Of yt-dlp's
# default extras only requests is kept: without it, YouTube refused about 4 streams in 9 rather than 1 in 9.
dependencies = [
    "teabot[voice]>=1.8.0.dev0,<2",
    "av>=14",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8",
    "requests>=2.32",
    "deno>=2.4",
]

[project.urls]
Source = "https://github.com/L3sius/teabot-music"

[project.entry-points."teabot.plugins"]
music = "teabot_music:plugin"

[dependency-groups]
dev = ["teabot[testing]", "asyncpg-stubs>=0.30", "pyright>=1.1.414", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_music"]

# Until teabot releases voice (teabot-dev/teabot#45), the plugin builds against that branch. Once it is released,
# drop this and raise the range to the release.
[tool.uv.sources]
teabot = { git = "https://github.com/teabot-dev/teabot", branch = "feat/voice" }

[tool.pytest.ini_options]
addopts = "-p teabot.testing.fixtures"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["teabot_music"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
